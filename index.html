<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Fun – 2do grado</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff3ff;--ink:#1d2b53;--sun:#ffcf33;--coral:#ff6b6b;--green:#2fbf85;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka','Trebuchet MS',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;text-align:center}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:2rem;margin:8px 0 2px}
p.sub{margin:0 0 14px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:22px;background:var(--card);box-shadow:0 5px 0 rgba(29,43,83,.18);padding:14px 8px;font-size:1.15rem;font-weight:600}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,43,83,.18)}
button:focus-visible{outline:4px solid var(--ink)}
.topic{font-size:1.2rem}
.topic .e{display:block;font-size:3rem;line-height:1.2}
.back{background:var(--sun);margin-bottom:10px;padding:8px 18px;font-size:1rem}
.big{font-size:6rem;line-height:1.1;margin:10px 0}
.card .e{font-size:2.6rem;display:block}
.card small{display:block;font-weight:400;opacity:.75}
.row{display:flex;gap:10px;justify-content:center;margin:12px 0}
.row button{flex:1;background:var(--green);color:#fff}
.row button.alt{background:var(--coral)}
.opts{display:grid;gap:10px;margin-top:10px}
.opts button{font-size:1.4rem;padding:16px}
.ok{background:var(--green)!important;color:#fff}
.no{background:var(--coral)!important;color:#fff;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bar{height:14px;background:#fff;border-radius:9px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.stars{font-size:2.6rem;margin:10px 0}
.q{font-size:1.5rem;font-weight:700;margin:6px 0}
.say{background:var(--sun);font-size:1rem;padding:8px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const T={
days:{n:'Days of the week',es:'Días de la semana',e:'📅',items:[['1️⃣','Monday','Lunes'],['2️⃣','Tuesday','Martes'],['3️⃣','Wednesday','Miércoles'],['4️⃣','Thursday','Jueves'],['5️⃣','Friday','Viernes'],['🎈','Saturday','Sábado'],['🌞','Sunday','Domingo']]},
greet:{n:'Greetings',es:'Saludos',e:'👋',items:[['👋','Hello','Hola'],['🌅','Good morning','Buenos días'],['☀️','Good afternoon','Buenas tardes'],['🌆','Good evening','Buenas tardes/noches'],['🌙','Good night','Buenas noches'],['🙋','Goodbye','Adiós'],['🤝','Nice to meet you','Mucho gusto'],['😊','How are you?','¿Cómo estás?'],['👍','I am fine, thank you','Estoy bien, gracias'],['🙏','Please','Por favor'],['💐','Thank you','Gracias']]},
num:{n:'Numbers',es:'Números 1-10',e:'🔢',items:[['1️⃣','One','Uno'],['2️⃣','Two','Dos'],['3️⃣','Three','Tres'],['4️⃣','Four','Cuatro'],['5️⃣','Five','Cinco'],['6️⃣','Six','Seis'],['7️⃣','Seven','Siete'],['8️⃣','Eight','Ocho'],['9️⃣','Nine','Nueve'],['🔟','Ten','Diez']]},
col:{n:'Colors',es:'Colores',e:'🎨',items:[['🔴','Red','Rojo'],['🔵','Blue','Azul'],['🟡','Yellow','Amarillo'],['🟢','Green','Verde'],['🟠','Orange','Naranja'],['🟣','Purple','Morado'],['⚫','Black','Negro'],['⚪','White','Blanco'],['🟤','Brown','Marrón']]},
ani:{n:'Animals',es:'Animales',e:'🐶',items:[['🐶','Dog','Perro'],['🐱','Cat','Gato'],['🐦','Bird','Pájaro'],['🐟','Fish','Pez'],['🐮','Cow','Vaca'],['🐴','Horse','Caballo'],['🐷','Pig','Cerdo'],['🐰','Rabbit','Conejo'],['🐘','Elephant','Elefante'],['🦁','Lion','León'],['🐵','Monkey','Mono'],['🐸','Frog','Rana']]},
fru:{n:'Fruits & food',es:'Frutas y comida',e:'🍎',items:[['🍎','Apple','Manzana'],['🍌','Banana','Plátano'],['🍇','Grapes','Uvas'],['🍊','Orange','Naranja'],['🍓','Strawberry','Fresa'],['🍉','Watermelon','Sandía'],['🥛','Milk','Leche'],['🍞','Bread','Pan'],['💧','Water','Agua'],['🍚','Rice','Arroz']]},
fam:{n:'Family',es:'Familia',e:'👨‍👩‍👧',items:[['👩','Mother','Mamá'],['👨','Father','Papá'],['👧','Sister','Hermana'],['👦','Brother','Hermano'],['👵','Grandmother','Abuela'],['👴','Grandfather','Abuelo'],['👶','Baby','Bebé'],['👨‍👩‍👧‍👦','Family','Familia']]},
body:{n:'Body parts',es:'Partes del cuerpo',e:'🖐️',items:[['🧠','Head','Cabeza'],['👀','Eyes','Ojos'],['👂','Ears','Orejas'],['👃','Nose','Nariz'],['👄','Mouth','Boca'],['🖐️','Hand','Mano'],['🦶','Foot','Pie'],['💪','Arm','Brazo']]},
sch:{n:'School things',es:'Útiles escolares',e:'✏️',items:[['✏️','Pencil','Lápiz'],['📖','Book','Libro'],['🎒','Backpack','Mochila'],['📏','Ruler','Regla'],['🖍️','Crayon','Crayola'],['✂️','Scissors','Tijeras'],['👩‍🏫','Teacher','Profesora'],['🪑','Chair','Silla']]}
};
const app=document.getElementById('app');
const sh=a=>[...a].sort(()=>Math.random()-.5);
let V=null;
function pickVoice(){
 const vs=speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').startsWith('en'));
 const pref=[/natural|neural|online/i,/google us english/i,/samantha|ava|allison|nicky|aaron|zira|jenny/i,/enhanced|premium/i];
 for(const r of pref){const f=vs.find(v=>r.test(v.name)&&/en[-_]US/.test(v.lang));if(f)return f}
 return vs.find(v=>/en[-_]US/.test(v.lang))||vs[0]||null;
}
try{V=pickVoice();speechSynthesis.onvoiceschanged=()=>{V=pickVoice()}}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(V)u.voice=V;u.rate=.85;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
function home(){
 app.innerHTML=`<h1>🌟 English Fun 🌟</h1><p class="sub">Elige un tema y juega</p><div class="grid">`+
 Object.keys(T).map(k=>`<button class="topic" onclick="topic('${k}')"><span class="e">${T[k].e}</span>${T[k].n}</button>`).join('')+`</div>`;
}
function topic(k){
 const t=T[k];
 app.innerHTML=`<button class="back" onclick="home()">⬅ Inicio</button><h1>${t.e} ${t.n}</h1><p class="sub">Toca cada tarjeta para escuchar 🔊</p><div class="grid">`+
 t.items.map(i=>`<button class="card" onclick="say('${i[1].replace(/'/g,"\\'")}')"><span class="e">${i[0]}</span>${i[1]}<small>${i[2]}</small></button>`).join('')+
 `</div><div class="row"><button onclick="play('${k}')">🎮 ¡Jugar!</button></div>`;
}
function makeQs(k){
 const t=T[k],it=t.items,qs=[];
 const pool=sh(it).slice(0,6);
 pool.forEach((x,n)=>{
  if(k==='days'&&n%2){ // día siguiente / anterior
   const i=it.indexOf(x),after=n%4===1,ans=it[(i+(after?1:6))%7][1];
   qs.push({q:`¿Qué día viene ${after?'DESPUÉS':'ANTES'} de ${x[1]}?`,say:'',a:ans,o:sh([ans,...sh(it.map(z=>z[1]).filter(z=>z!==ans&&z!==x[1])).slice(0,2)])});
  } else if(k==='num'||k==='days'||k==='col'||k==='greet'||k==='ani'||k==='fru'||k==='fam'||k==='body'||k==='sch'){
   const wrong=sh(it.filter(z=>z!==x)).slice(0,2).map(z=>z[1]);
   qs.push({big:x[0],q:'¿Cómo se dice esto en inglés?',say:x[1],a:x[1],o:sh([x[1],...wrong])});
  }
 });
 return qs;
}
let G;
function play(k){G={k,qs:makeQs(k),i:0,s:0};ask()}
function ask(){
 const q=G.qs[G.i];
 app.innerHTML=`<button class="back" onclick="topic('${G.k}')">⬅ Salir</button>
 <div class="bar"><i style="width:${G.i/G.qs.length*100}%"></i></div><p class="sub">Pregunta ${G.i+1} de ${G.qs.length} · ⭐ ${G.s}</p>
 ${q.big?`<div class="big">${q.big}</div>`:'<div class="big">🤔</div>'}
 <div class="q">${q.q}</div>${q.big?`<button class="say" onclick="say('${q.say.replace(/'/g,"\\'")}')">🔊 Escuchar</button>`:''}
 <div class="opts">${q.o.map(o=>`<button onclick="pick(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>`;
}
function pick(b,o){
 const q=G.qs[G.i];
 document.querySelectorAll('.opts button').forEach(x=>x.disabled=true);
 if(o===q.a){b.classList.add('ok');b.textContent='✅ '+o;G.s++;say(o)}
 else{b.classList.add('no');b.textContent='❌ '+o;document.querySelectorAll('.opts button').forEach(x=>{if(x.textContent===q.a)x.classList.add('ok')});say(q.a)}
 setTimeout(()=>{G.i++;G.i<G.qs.length?ask():end()},1500);
}
function end(){
 const p=G.s/G.qs.length,st=p>=.8?'⭐⭐⭐':p>=.5?'⭐⭐':'⭐';
 app.innerHTML=`<h1>${p>=.8?'🎉 ¡Muy bien! 🎉':p>=.5?'👏 ¡Buen intento!':'💪 ¡Sigue practicando!'}</h1><div class="stars">${st}</div>
 <p class="sub">Acertaste ${G.s} de ${G.qs.length}</p>
 <div class="row"><button onclick="play('${G.k}')">🔁 Otra vez</button><button class="alt" onclick="home()">🏠 Inicio</button></div>`;
 say(p>=.8?'Great job!':'Good try!');
}
home();
</script>
</body>
</html>
